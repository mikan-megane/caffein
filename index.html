<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Caffein - Screen On</title>
<style>
:root{
  --bg:#f7f6f2;
  --fg:#1f1d1a;
  --muted:#8d8a83;
  --line:#dedbd2;
  --panel:#ffffff;
  --accent:#7a5c3e;
  --accent-fg:#ffffff;
  --danger:#a33b2e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161513;
    --fg:#e6e2da;
    --muted:#7d7a72;
    --line:#33302b;
    --panel:#1e1c1a;
    --accent:#c9a877;
    --accent-fg:#161513;
    --danger:#c9584a;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,"Hiragino Kaku Gothic ProN",monospace;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100dvh;gap:2.25rem;padding:2rem
}
header{display:flex;flex-direction:column;align-items:center;gap:.35rem}
h1{font-size:1.05rem;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--fg)}
h1 span{color:var(--accent)}
.tagline{font-size:.7rem;color:var(--muted);letter-spacing:.08em}

.video-wrap{
  width:min(420px,88vw);
  aspect-ratio:30/1;
  overflow:hidden;
  border:1px solid var(--line);
  background:#000
}
video{display:block;width:100%;height:100%;object-fit:cover}
@media (prefers-color-scheme: light){
  video{filter:none}
}

#status{font-size:.75rem;color:var(--muted);letter-spacing:.05em}
#status::before{content:"— ";color:var(--accent)}

#pipBtn{
  all:unset;cursor:pointer;
  padding:.65rem 2.4rem;
  border:1px solid var(--fg);
  background:transparent;color:var(--fg);
  font-size:.8rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  transition:background .12s,color .12s,transform .1s;
  tap-highlight-color:transparent
}
#pipBtn:hover:not(:disabled){background:var(--fg);color:var(--bg)}
#pipBtn:active{transform:translateY(1px)}
#pipBtn.active{border-color:var(--danger);color:var(--danger)}
#pipBtn.active:hover{background:var(--danger);color:var(--bg)}
#pipBtn:disabled{opacity:.25;cursor:default}

.rule{width:min(420px,88vw);height:1px;background:var(--line)}

.timer-section{display:flex;flex-direction:column;align-items:center;gap:.9rem;width:min(420px,88vw)}
.section-label{font-size:.65rem;color:var(--muted);letter-spacing:.3em;text-transform:uppercase}
.timer-presets{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.timer-presets button{
  all:unset;cursor:pointer;
  padding:.35rem .8rem;
  border:1px solid var(--line);
  background:transparent;color:var(--muted);
  font-size:.75rem;letter-spacing:.05em;
  transition:all .12s
}
.timer-presets button:hover{border-color:var(--fg);color:var(--fg)}
.timer-presets button:active{transform:translateY(1px)}
.timer-presets button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.custom-input{display:flex;gap:.5rem;align-items:center}
.custom-input input{
  width:4.5rem;
  padding:.35rem .5rem;
  border:1px solid var(--line);
  background:transparent;color:var(--fg);
  font:inherit;font-size:.8rem;text-align:center;
  -moz-appearance:textfield
}
.custom-input input:focus{outline:none;border-color:var(--fg)}
.custom-input input::-webkit-outer-spin-button,
.custom-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.custom-input label{font-size:.7rem;color:var(--muted)}
.custom-input button{
  all:unset;cursor:pointer;
  padding:.35rem .8rem;
  border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-fg);
  font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .1s
}
.custom-input button:active{transform:translateY(1px)}
#timerStatus{font-size:.75rem;color:var(--muted);letter-spacing:.05em}
#timerCancel{
  all:unset;cursor:pointer;
  padding:.3rem .8rem;
  border:1px solid var(--danger);color:var(--danger);
  background:transparent;
  font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  display:none;
  transition:all .12s
}
#timerCancel:hover{background:var(--danger);color:var(--bg)}
#timerCancel:active{transform:translateY(1px)}
#timerCancel.visible{display:inline-block}

#info{
  font-size:.7rem;color:var(--muted);text-align:center;
  max-width:340px;line-height:1.9;letter-spacing:.03em
}
</style>
</head>
<body>

<header>
  <h1>Caff<span>ein</span></h1>
  <p class="tagline">keep the screen awake</p>
</header>

<div class="video-wrap">
  <video id="vid" autoplay muted loop playsinline></video>
</div>

<p id="status">Loading…</p>
<button id="pipBtn">Start PiP</button>

<div class="rule"></div>

<div class="timer-section">
  <p class="section-label">Sleep timer</p>
  <div class="timer-presets">
    <button data-min="5">5 min</button>
    <button data-min="15">15 min</button>
    <button data-min="30">30 min</button>
    <button data-min="60">60 min</button>
  </div>
  <div class="custom-input">
    <input id="customMin" type="number" min="1" max="999" placeholder="min">
    <label>min</label>
    <button id="customSet">Set</button>
  </div>
  <p id="timerStatus">Sleep timer: Off</p>
  <button id="timerCancel">Cancel timer</button>
</div>

<p id="info">
  iPhone で PiP 起動中は画面が消えにくい性質を利用し、<br>
  小さな無音動画を常時再生してスリープを防止します
</p>

<script>
const vid = document.getElementById('vid')
const btn = document.getElementById('pipBtn')
const status = document.getElementById('status')
const timerStatus = document.getElementById('timerStatus')
const timerCancel = document.getElementById('timerCancel')
const presetBtns = document.querySelectorAll('.timer-presets button')
const customMin = document.getElementById('customMin')
const customSet = document.getElementById('customSet')

const darkMq = matchMedia('(prefers-color-scheme: dark)')

function videoSrc() {
  return darkMq.matches ? 'silent-dark.mp4' : 'silent-light.mp4'
}

// Set initial video (light mode → white video, dark mode → black video)
vid.src = videoSrc()

// Swap video if scheme changes while not playing
darkMq.addEventListener('change', () => {
  if (!document.pictureInPictureElement && vid.webkitPresentationMode !== 'picture-in-picture') {
    const t = vid.currentTime
    vid.src = videoSrc()
    vid.currentTime = t
    vid.play().catch(() => {})
  }
})

let sleepTimeout = null
let remainingSeconds = 0
let countdownInterval = null

function supportsPiP() {
  return 'requestPictureInPicture' in HTMLVideoElement.prototype ||
    'webkitSetPresentationMode' in vid
}

function updateUI(pipOn) {
  btn.textContent = pipOn ? 'Stop PiP' : 'Start PiP'
  btn.classList.toggle('active', pipOn)
  status.textContent = pipOn ? 'PiP active – screen stays on' : 'PiP stopped'
}

function enterPiP() {
  if (document.pictureInPictureElement || vid.webkitPresentationMode === 'picture-in-picture') return
  vid.play().catch(() => {})
  if (vid.requestPictureInPicture) {
    vid.requestPictureInPicture().then(() => updateUI(true)).catch(() => {})
  } else if (vid.webkitSetPresentationMode) {
    vid.webkitSetPresentationMode('picture-in-picture')
    updateUI(true)
  }
}

function exitPiP() {
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture().catch(() => {})
  } else if (vid.webkitPresentationMode === 'picture-in-picture') {
    vid.webkitSetPresentationMode('inline')
  }
}

function clearSleepTimer() {
  if (sleepTimeout) { clearTimeout(sleepTimeout); sleepTimeout = null }
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null }
  remainingSeconds = 0
  timerStatus.textContent = 'Sleep timer: Off'
  timerCancel.classList.remove('visible')
  presetBtns.forEach(b => b.classList.remove('active'))
}

function formatTime(sec) {
  const m = Math.floor(sec / 60)
  const s = sec % 60
  return m + ':' + String(s).padStart(2, '0')
}

function startSleepTimer(minutes) {
  clearSleepTimer()
  remainingSeconds = minutes * 60

  timerStatus.textContent = 'Sleep timer: ' + formatTime(remainingSeconds)
  timerCancel.classList.add('visible')

  enterPiP()

  countdownInterval = setInterval(() => {
    remainingSeconds--
    if (remainingSeconds <= 0) {
      clearSleepTimer()
      return
    }
    timerStatus.textContent = 'Sleep timer: ' + formatTime(remainingSeconds)
  }, 1000)

  sleepTimeout = setTimeout(() => {
    exitPiP()
    vid.pause()
    clearSleepTimer()
    timerStatus.textContent = 'Sleep timer: Finished – sleeping'
  }, minutes * 60 * 1000)
}

presetBtns.forEach(b => {
  b.addEventListener('click', () => {
    const isActive = b.classList.contains('active')
    if (isActive) {
      clearSleepTimer()
      return
    }
    presetBtns.forEach(x => x.classList.remove('active'))
    b.classList.add('active')
    customMin.value = ''
    startSleepTimer(parseInt(b.dataset.min, 10))
  })
})

customSet.addEventListener('click', () => {
  const v = parseInt(customMin.value, 10)
  if (!v || v < 1) return
  presetBtns.forEach(x => x.classList.remove('active'))
  startSleepTimer(v)
})

customMin.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') customSet.click()
})

timerCancel.addEventListener('click', clearSleepTimer)

btn.addEventListener('click', () => {
  if (document.pictureInPictureElement || vid.webkitPresentationMode === 'picture-in-picture') {
    exitPiP()
    return
  }
  if (!supportsPiP()) return

  vid.play().catch(() => {})
  status.textContent = 'Starting PiP…'

  if (vid.requestPictureInPicture) {
    vid.requestPictureInPicture()
      .then(() => updateUI(true))
      .catch(e => { status.textContent = 'PiP failed: ' + e.message })
  } else if (vid.webkitSetPresentationMode) {
    vid.webkitSetPresentationMode('picture-in-picture')
    updateUI(true)
  }
})

vid.addEventListener('enterpictureinpicture', () => updateUI(true))
vid.addEventListener('leavepictureinpicture', () => updateUI(false))

vid.addEventListener('loadeddata', () => {
  const ok = supportsPiP()
  status.textContent = ok ? 'Ready – tap Start PiP' : 'PiP not supported on this device'
  btn.disabled = !ok
})

vid.addEventListener('error', () => {
  status.textContent = 'Video load failed'
})
</script>

</body>
</html>
